name: Offline CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
      - run: terraform -chdir=terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - name: Install hash-locked scanner
        run: |
          python3.12 -m venv .venv-audit
          .venv-audit/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-audit.txt
          .venv-audit/bin/python -m pip check
      - name: Audit scanner dependencies
        run: .venv-audit/bin/python -m pip_audit -r requirements-audit.txt --require-hashes --strict
      - name: Audit project dependencies
        run: .venv-audit/bin/python -m pip_audit -r requirements-dev.txt --require-hashes --strict
      - name: Install hash-locked test dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          .venv/bin/python -m pip check
      - run: .venv/bin/python -m unittest discover -s tests -v
